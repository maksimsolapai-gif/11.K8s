name: Kubernetes Cluster Monitor Pro (Full Status Slack)

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: 

jobs:
  monitor:
    runs-on: self-hosted
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.31.0'

    - name: Scan Cluster and Gather Stats
      id: scan_k8s
      run: |
        echo "=== Сбор общей статистики кластера ==="
        
        # 1. Считаем общее количество подов и количество подов по статусам
        TOTAL_PODS=$(kubectl get pods -A --no-headers | wc -l | tr -d ' ')
        RUNNING_PODS=$(kubectl get pods -A --no-headers | grep -c "Running" || true)
        COMPLETED_PODS=$(kubectl get pods -A --no-headers | grep -c "Completed" || true)
        
        # Записываем простую статистику в переменные окружения
        echo "TOTAL_PODS_COUNT=$TOTAL_PODS" >> $GITHUB_ENV
        echo "RUNNING_PODS_COUNT=$RUNNING_PODS" >> $GITHUB_ENV
        echo "COMPLETED_PODS_COUNT=$COMPLETED_PODS" >> $GITHUB_ENV
        
        # 2. Ищем проблемные поды
        FAILED_PODS=$(kubectl get pods -A --no-headers | grep -v -E "Running|Completed" | grep -v -E "NAMESPACE" || true)
        
        # Проверяем на наличие ошибок
        if [ -n "$(echo "$FAILED_PODS" | tr -d '[:space:]')" ]; then
          echo "ALERT_TRIGGERED=true" >> $GITHUB_ENV
          echo "❌ ОБНАРУЖЕНЫ СБОИ В ПОДАХ!"
          
          # Запись многострочного списка ошибок через EOF
          echo "FAILED_PODS_LIST<<EOF" >> $GITHUB_ENV
          echo "$FAILED_PODS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          echo "$FAILED_PODS" | while read -r ns name ready status restarts age; do
            if [ -z "$ns" ] || [ -z "$name" ]; then continue; fi
            echo "--------------------------------------------------"
            echo "Поломка в Namespace: $ns | Pod: $name | Статус: $status"
            echo "--------------------------------------------------"
            kubectl describe pod "$name" -n "$ns" | tail -n 20
          done
          
          exit 1
        else
          echo "ALERT_TRIGGERED=false" >> $GITHUB_ENV
          echo "✅ Все поды работают штатно. Собираем список для отчета..."
          
          # Получаем красивый список всех живых подов
          ALL_PODS_SUMMARY=$(kubectl get pods -A --no-headers -o custom-columns="NAMESPACE:.metadata.namespace,NAME:.metadata.name,STATUS:.status.phase")
          
          # ПРАВИЛЬНАЯ запись многострочного списка через EOF для GitHub
          echo "ALL_PODS_LIST<<EOF" >> $GITHUB_ENV
          echo "$ALL_PODS_SUMMARY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        fi

     # СЦЕНАРИЙ 1: Отправка уведомления при УСПЕШНОЙ проверке через curl
    - name: Send Slack Notification on Success
      if: success()
      run: |
        echo "=== Отправка отчета в Slack ==="
        
        # Формируем JSON-сообщение для Slack с блочной структурой
        JSON_PAYLOAD=\$(cat <<EOF
        {
          "text": "✅ *K8s кластер полностью здоров!*",
          "attachments": [
            {
              "color": "#00FF00",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Статистика кластера:*\n• Всего подов: \`${{ env.TOTAL_PODS_COUNT }}\`\n• В статусе Running: \`${{ env.RUNNING_PODS_COUNT }}\`\n• В статусе Completed: \`${{ env.COMPLETED_PODS_COUNT }}\`"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Список запущенных подов:*\n\`\`\`\n${{ env.ALL_PODS_LIST }}\n\`\`\`"
                  }
                }
              ]
            }
          ]
        }
        EOF
        )
        
        # Отправляем запрос напрямую на Webhook URL
        curl -X POST -H 'Content-type: application/json' --data "\(JSON_PAYLOAD" "\){{ secrets.SLACK_WEBHOOK_URL }}"

    # СЦЕНАРИЙ 2: Отправка уведомления при ОБНАРУЖЕНИИ ОШИБОК через curl
    - name: Send Slack Notification on Failure
      if: failure() && env.ALERT_TRIGGERED == 'true'
      run: |
        echo "=== Отправка аларма в Slack ==="
        
        JSON_PAYLOAD=\$(cat <<EOF
        {
          "text": "🚨 *Критический сбой в Kubernetes!*",
          "attachments": [
            {
              "color": "#FF0000",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Обнаружены проблемные поды:*\n\`\`\`\n${{ env.FAILED_PODS_LIST }}\n\`\`\`"
                  }
                }
              ]
            }
          ]
        }
        EOF
        )
        
        curl -X POST -H 'Content-type: application/json' --data "\(JSON_PAYLOAD" "\){{ secrets.SLACK_WEBHOOK_URL }}"
