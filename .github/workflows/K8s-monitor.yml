name: Kubernetes Cluster Monitor Pro (Full Status Slack)

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: 

jobs:
  monitor:
    runs-on: self-hosted
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.31.0'

    - name: Scan Cluster and Gather Stats
      id: scan_k8s
      run: |
        echo "=== Сбор общей статистики кластера ==="
        
        # 1. Считаем общее количество подов и количество подов по статусам
        TOTAL_PODS=\$(kubectl get pods -A --no-headers | wc -l | tr -d ' ')
        RUNNING_PODS=\$(kubectl get pods -A --no-headers | grep -c "Running" || true)
        COMPLETED_PODS=\$(kubectl get pods -A --no-headers | grep -c "Completed" || true)
        
        # Записываем общую статистику в переменные окружения
        echo "TOTAL_PODS_COUNT=\(TOTAL_PODS" >> \)GITHUB_ENV
        echo "RUNNING_PODS_COUNT=\(RUNNING_PODS" >> \)GITHUB_ENV
        echo "COMPLETED_PODS_COUNT=\(COMPLETED_PODS" >> \)GITHUB_ENV
        
        # 2. Ищем проблемные поды (которые НЕ Running и НЕ Completed)
        FAILED_PODS=\$(kubectl get pods -A --no-headers | grep -v -E "Running|Completed" | grep -v -E "NAMESPACE" || true)
        
        # Проверяем, пустая ли переменная с ошибками
        if [ -n "\((echo "\)FAILED_PODS" | tr -d '[:space:]')" ]; then
          echo "ALERT_TRIGGERED=true" >> \$GITHUB_ENV
          echo "❌ ОБНАРУЖЕНЫ СБОИ В ПОДАХ!"
          
          CLEANED_PODS=\((echo "\)FAILED_PODS" | awk '{print \$0 "\\n"}')
          echo "FAILED_PODS_LIST=\(CLEANED_PODS" >> \)GITHUB_ENV
          
          # Вывод логов в консоль GitHub Actions для дебага
          echo "\$FAILED_PODS" | while read -r ns name ready status restarts age; do
            if [ -z "\(ns" ] \vert{}\vert{} [ -z "\)name" ]; then continue; fi
            echo "--------------------------------------------------"
            echo "Поломка в Namespace: \$ns | Pod: \(name \vert{} Статус: \)status"
            echo "--------------------------------------------------"
            kubectl describe pod "\(name" -n "\)ns" | tail -n 20
          done
          
          exit 1
        else
          echo "ALERT_TRIGGERED=false" >> \$GITHUB_ENV
          echo "✅ Все поды работают штатно. Собираем список для отчета..."
          
          # Получаем красивый компактный список всех живых подов (Namespace, Name, Status)
          ALL_PODS_SUMMARY=\$(kubectl get pods -A --no-headers -o custom-columns="NAMESPACE:.metadata.namespace,NAME:.metadata.name,STATUS:.status.phase" | awk '{print \$0 "\\n"}')
          echo "ALL_PODS_LIST=\(ALL_PODS_SUMMARY" >> \)GITHUB_ENV
        fi

    # СЦЕНАРИЙ 1: Отправка уведомления при УСПЕШНОЙ проверке
    - name: Send Slack Notification on Success
      if: success()
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: \${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_URL: \${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_CHANNEL: 'general'
        SLACK_USERNAME: 'K8s Monitor Bot'
        SLACK_ICON_EMOJI: ':white_check_mark:'
        SLACK_COLOR: '#00FF00' # Зеленый цвет панели
        SLACK_TITLE: '✅ К8s кластер полностью здоров!'
        SLACK_MESSAGE: |
          *Статистика кластера:*
          • Всего подов в кластере: `${{ env.TOTAL_PODS_COUNT }}`
          • В статусе Running: `${{ env.RUNNING_PODS_COUNT }}`
          • В статусе Completed: `${{ env.COMPLETED_PODS_COUNT }}`
          
          *Список запущенных подов:*
          ```
          \${{ env.ALL_PODS_LIST }}
          ```
          _Все проверки пройдены успешно._

    # СЦЕНАРИЙ 2: Отправка уведомления при ОБНАРУЖЕНИИ ОШИБОК
    - name: Send Slack Notification on Failure
      if: failure() && env.ALERT_TRIGGERED == 'true'
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK: \${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_WEBHOOK_URL: \${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_CHANNEL: 'general'
        SLACK_USERNAME: 'K8s Monitor Bot'
        SLACK_ICON_EMOJI: ':rotating_light:'
        SLACK_COLOR: '#FF0000' # Красный цвет панели
        SLACK_TITLE: '🚨 Критический сбой в Kubernetes!'
        SLACK_MESSAGE: |
          *Обнаружены проблемные поды:*
          ```
          \${{ env.FAILED_PODS_LIST }}
          ```
          *Общая статистика на момент падения:* Подов всего: `${{ env.TOTAL_PODS_COUNT }}`, Активных: `${{ env.RUNNING_PODS_COUNT }}`.
          
          [Посмотреть детальные логи сбоя в GitHub](\${{ github.server_url }}/\({{{ github.repository }}/actions/runs/\){{ github.run_id }})
